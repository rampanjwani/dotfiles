# Sourcing matugen colors
source = $HOME/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf

$text_color = $on_surface
$entry_background_color = $surface_alpha
$entry_border_color = $tertiary
$entry_color = $on_surface
$font_family = CaskaydiaCove Nerd Font
$font_family_clock = CaskaydiaCove Nerd Font
$font_symbols = CaskaydiaCove Nerd Font Propo

general {
    hide_cursor = true
    ignore_empty_input = false
    fail_timeout = 2000
    fractional_scaling = 2
    screencopy_mode = 0
    text_trim = true
}

background {
    monitor =
    path = $image
    blur_passes = 4
    blur_size = 12
    noise = 0.02
    contrast = 0.90
    brightness = 0.60
    vibrancy = 0.15
    vibrancy_darkness = 0.20
}

animations {
    enabled = true
    bezier = lockEase, 0.22, 1.0, 0.36, 1.0
    animation = fadeIn, 1, 5, lockEase
    animation = fadeOut, 1, 4, lockEase
}

# Status: Battery & WiFi (Top Left)
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}

# Weather (Top Right)
label {
    monitor =
    text = cmd[update:60000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/weather.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, -30
    halign = right
    valign = top
}

# Clock (Center Upper)
label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 72
    font_family = $font_family_clock
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.40)
}

# Date (Below Clock)
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family
    position = 0, 195
    halign = center
    valign = center
}

# Password Input Field (Transparent background)
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1

    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    font_family = $font_family

    placeholder_text = <span foreground="##a6adc8">Enter password</span>
    rounding = 16
    fade_on_empty = false

    check_color = $primary
    fail_color = $error
    fail_text = <span foreground="##f38ba8">$FAIL  <b>($ATTEMPTS)</b></span>
    capslock_color = $secondary

    position = 0, 20
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# Caps Lock Warning (Below Input Field)
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $error
    font_size = 13
    font_family = $font_family
    position = 0, -35
    halign = center
    valign = center
}

# User (Bottom)
label {
    monitor =
    text =   $USER
    color = $text_color
    font_size = 18
    font_family = $font_symbols
    position = 0, 50
    halign = center
    valign = bottom
}
