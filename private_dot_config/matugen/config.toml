[config]
version_check = false
source_color_index = 0

[templates.neovim]
input_path = "~/.config/matugen/templates/nvim-colors.json"
output_path = "~/.cache/matugen/nvim-colors.json"
mode = "Smart"
type = "SchemeSmart"
#post_hook = "pkill -SIGUSR1 nvim"

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar-colors.css'
output_path = '~/.config/waybar/colors.css'
# post_hook not needed: Waybar's reload_style_on_change natively hot-reloads colors.css in-memory without restarting modules or killing child process groups

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/matugen-hyprlock.conf'
output_path = '~/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf'

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync-colors.css'
output_path = '~/.config/swaync/colors.css'
post_hook = "swaync-client -rs"

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout-colors.css'
output_path = '~/.config/wlogout/colors.css'
#
[templates.Obsidian]
input_path = "~/.config/matugen/templates/obsidian-minimal-matugen-colors.css"
output_path = "~/Documents/Vault/.obsidian/snippets/obsidian-minimal-matugen-colors.css"

[templates.vesktop]
input_path = "~/.config/matugen/templates/vesktop-colors.css"
output_path = "~/.config/vesktop/themes/matugen.theme.css"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/matugen/colors.lua"
post_hook = "hyprctl reload"
